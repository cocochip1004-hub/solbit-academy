name: One-time verified Solbit PNG import
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/solbit-import-png-once.yml']
permissions:
  contents: write
jobs:
  import-images:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update/solbit-v26-staged'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Download only two immutable PNGs and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          source = 'https://raw.githubusercontent.com/hada-notion/project1/602c52a6cfcc2a423cfebd02db7619c82c9b3d07/'
          expected = {
              'assets/admin-settings/menu-bulk-button.png': '8850b1c9bf89e85a629c78bdc8e2a46889531ac0e5bf6e7879566eeb5a2e9188',
              'assets/brand/hada-wordmark.png': 'ef8a0f39e1068108ef934295831ecd7a07f2b0c0c977a7b30d60912423b90bbc',
          }
          for name, digest in expected.items():
              with urllib.request.urlopen(source + name, timeout=30) as response:
                  data = response.read()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), name
              assert hashlib.sha256(data).hexdigest() == digest, name
              path = pathlib.Path(name)
              assert not path.is_symlink(), name
              if path.exists():
                  assert path.read_bytes() == data, 'Existing asset differs: ' + name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(name, len(data), digest)
          PY
      - name: Commit PNGs to the candidate branch and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/admin-settings/menu-bulk-button.png assets/brand/hada-wordmark.png
          git rm -- .github/workflows/solbit-import-png-once.yml
          git diff --cached --check
          git commit -m "Complete verified v2.6 PNG assets and remove one-time importer"
          git push origin HEAD:refs/heads/update/solbit-v26-staged
